# Source products. URLs and member names were verified against the live sources on 2026-10-18 (docs/SPIKES.md).
# `data_version` comes from the BTS version history (https://www.bts.gov/faf/versions), not from the files.
# A year that appears in a file but is not classified here fails the build on purpose.

products:
  faf5:
    faf_version: "5.7.1"
    benchmark_year: 2017
    scenario: mid
    release: "FAF5.7.1 (2025-08-15)"
    data_version:
      base: [2017]
      final: [2018, 2019, 2020, 2021, 2022, 2023]
      preliminary: [2024]
      forecast_from: 2025
    files:
      regional:
        url: https://faf.ornl.gov/faf5/Data/Download_Files/FAF5.7.1.zip
        member: FAF5.7.1.csv
        schema: faf5_regional
      state:
        url: https://faf.ornl.gov/faf5/Data/Download_Files/FAF5.7.1_State.zip
        member: FAF5.7.1_State.csv
        schema: faf5_state
      # High/Low forecast scenarios (forecast years only). Their mid-range columns repeat the mid-range files.
      regional_hilo:
        url: https://faf.ornl.gov/faf5/Data/Download_Files/FAF5.7.1_HiLoForecasts.zip
        member: FAF5.7.1_HiLoForecasts.csv
        schema: faf5_regional_hilo
        level: regional
      state_hilo:
        url: https://faf.ornl.gov/faf5/Data/Download_Files/FAF5.7.1_State_HiLoForecasts.zip
        member: FAF5.7.1_State_HiLoForecasts.csv
        schema: faf5_state_hilo
        level: state
      metadata:
        url: https://faf.ornl.gov/faf5/data/FAF5_metadata.xlsx
    probes:   # HEAD-probed by `fetch --check-only` to notice new releases; never downloaded automatically
      - pattern: "https://faf.ornl.gov/faf5/Data/Download_Files/FAF{v}.zip"
        candidates: ["5.7.2", "5.8", "5.8.1"]
    zones:
      url: https://faf.ornl.gov/faf5/data/2017_CFS_Metro_Areas_with_FAF.zip
      member: 2017_CFS_Metro_Areas_with_FAF.shp
      id_field: FAF_Zone
      name_field: FAF_Zone_D

  faf6:
    faf_version: "6.0"
    benchmark_year: 2022
    scenario: mid
    release: "FAF6.0"
    data_version:
      base: [2022]
      forecast_from: 2023
    files:
      regional:
        url: https://faf.ornl.gov/faf6/data/Download_Files/ZIP/FAF6.0.zip
        member: FAF6.0.csv
        schema: faf6_regional
      state:
        url: https://faf.ornl.gov/faf6/data/Download_Files/ZIP/FAF6.0_State.zip
        member: FAF6.0_State.csv
        schema: faf6_state
      metadata:
        url: https://faf.ornl.gov/faf6/data/FAF6_Metadata.xlsx
    probes:
      - pattern: "https://faf.ornl.gov/faf6/data/Download_Files/ZIP/FAF{v}.zip"
        candidates: ["6.0.1", "6.1", "6.1.1", "6.2"]
    zones:
      url: https://faf.ornl.gov/faf6/data/FAF6.zip
      member: FAF6.shp
      id_field: FAF6
      name_field: FAF6_SHORT

  history:
    # FAF5-methodology reprocessed history, state level only, four benchmark-style years. Kept separate from the annual series.
    faf_version: "5.7.1"
    benchmark_year: 2017      # values are in 2017 dollars (FAF5 User Guide, `value` field)
    scenario: mid
    release: "FAF5.7.1 reprocessed state history 1997-2012"
    data_version:
      historical: [1997, 2002, 2007, 2012]
    files:
      state:
        url: https://faf.ornl.gov/faf5/Data/Download_Files/FAF5.7.1_Reprocessed_1997-2012_State.zip
        member: FAF5.7.1_Reprocessed_1997-2012_State.csv
        schema: faf5_history_state

  county:
    # Experimental county-level estimates (FAF5.6.1-based, 2022, tons only; tons are kilotons per the BTS technical report).
    faf_version: "county-exp"
    label: "County estimates (experimental)"
    year: 2022
    release: "FAF5 experimental county-level estimates, 2022 (BTS, December 2024; based on FAF5.6.1)"
    # the state zip name comes from the state config: "<fips> - <name>.zip" (override with overrides.county_zip_name)
    state_files:
      tables:
        url: "https://faf.ornl.gov/faf5/Data/County/{fips} - {name}.zip"
    files:
      factors:
        url: https://faf.ornl.gov/faf5/Data/County/All_Experimental_Disaggregation_Factors.zip
    tables:
      c2c: {member: "1.County-to-County.csv", schema: county_c2c}
      c2f: {member: "2.County-to-FAF.csv", schema: county_c2f}
      f2c: {member: "2.FAF-to-County.csv", schema: county_f2c}
    factor_files:    # file stem -> mode group
      truck: truck
      rail: rail
      water: water
      pipeline: pipeline
    # Code labels from the BTS technical report (Tables 12 and 13). Commodity groups are SCTG ranges; mode 11 bundles FAF
    # modes 1 (truck) and 4 (air); FAF modes 7 and 8 are not in the release.
    dims:
      commodity:
        sctg0109: "Agricultural products (SCTG 01-09)"
        sctg1014: "Gravel and mining products (SCTG 10-14)"
        sctg1519: "Coal and other energy products (SCTG 15-19)"
        sctg2033: "Chemicals, wood and metals (SCTG 20-33)"
        sctg3499: "Manufactured goods, mixed freight, waste and unknown (SCTG 34-99)"
      mode:
        "2": "Rail"
        "3": "Water"
        "5": "Multiple modes and mail"
        "6": "Pipeline"
        "11": "Truck and air"

  census_county_boundaries:
    release: "Census 2022 cartographic boundary files, counties (1:500,000)"
    files:
      counties:
        url: https://www2.census.gov/geo/tiger/GENZ2022/shp/cb_2022_us_county_500k.zip
        member: cb_2022_us_county_500k.shp

  census_county_centers:
    # Census 2020 county population-weighted centers of population; used only to place zone anchor points.
    release: "Census 2020 centers of population"
    files:
      counties:
        url: https://www2.census.gov/geo/docs/reference/cenpop2020/county/CenPop2020_Mean_CO.txt

  network:
    release: "FAF5 model network and 2017/2022/2050 baseline truck assignments"
    files:
      links:
        url: https://ops.fhwa.dot.gov/freight/freight_analysis/faf/faf_highway_assignment_results/FAF5_Model_Highway_Network.zip
        member_dir: "Networks/Geodatabase Format/FAF5Network.gdb"
    assignments:
      # `token` is how the year appears inside the column names of the assignment tables.
      - year: 2017
        token: "17"
        url: https://ops.fhwa.dot.gov/freight/freight_analysis/faf/faf_highway_assignment_results/FAF5_2017_HighwayAssignmentResults_04_07_2022.zip
        member_dir: "Assignment Flow Tables/CSV Format/"
        file_suffix: "_2017.csv"
      - year: 2022
        token: "22"
        url: https://ops.fhwa.dot.gov/freight/freight_analysis/faf/faf_highway_assignment_results/FAF5_2022_HighwayAssignmentResults_04_07_2022.zip
        member_dir: "Assignment Flow Tables/CSV Format/"
        file_suffix: "_2022.csv"
      - year: 2050
        token: "50Base"
        url: https://ops.fhwa.dot.gov/freight/freight_analysis/faf/faf_highway_assignment_results/FAF5_2050_HighwayAssignmentResults_09_17_2022.zip
        member_dir: "Forecast2050BaselineNetworksAndAssignments/Assignment Flow Tables/CSV Format/"
        file_suffix: "_2050Base.csv"
    # table file stem -> (truck_type, market); the `type` token in the column names is checked against this.
    tables:
      "FAF5 Total Truck Flows by Commodity": {truck_type: all, market: total, token: All}
      "FAF5 Domestic Truck Flows by Commodity": {truck_type: all, market: domestic, token: Dom}
      "FAF5 Import Truck Flows by Commodity": {truck_type: all, market: import, token: Imp}
      "FAF5 Export Truck Flows by Commodity": {truck_type: all, market: export, token: Exp}
      "FAF5 Total SU Truck Flows by Commodity": {truck_type: su, market: total, token: SU}
      "FAF5 Total CU Truck Flows by Commodity": {truck_type: cu, market: total, token: CU}

geo:
  zone_simplify_deg: 0.005     # Douglas-Peucker tolerance for zone GeoJSON (~500 m)
  coord_decimals: 4
  pmtiles_minzoom: 3
  pmtiles_maxzoom: 12
